<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050914" />
    <title>FRIDAY | Stark Systems</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050a13;
        --panel: rgba(10, 19, 32, 0.94);
        --panel-soft: rgba(13, 28, 45, 0.76);
        --cyan: #73edff;
        --cyan-bright: #c2f9ff;
        --blue: #258aff;
        --text: #e8f5ff;
        --muted: #829bb1;
        --line: rgba(104, 211, 255, 0.17);
        --glow: 0 0 32px rgba(25, 125, 220, 0.08);
        --radius: 16px;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: radial-gradient(ellipse at 50% 0%, rgba(22, 98, 160, 0.16), transparent 48%),
                    linear-gradient(145deg, #050a13, #081321 55%, #040811);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        transition: background 0.5s ease;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.13;
        background-image: linear-gradient(rgba(93, 190, 238, 0.08) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(93, 190, 238, 0.08) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, #000, transparent 85%);
      }

      button, input, textarea, select { font: inherit; }

      button {
        min-height: 40px;
        padding: 10px 14px;
        color: var(--cyan-bright);
        background: rgba(13, 43, 67, 0.78);
        border: 1px solid rgba(104, 211, 255, 0.25);
        border-radius: 9px;
        cursor: pointer;
        transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      button:hover:not(:disabled) { background: rgba(19, 67, 99, 0.9); border-color: rgba(115, 237, 255, 0.65); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }

      button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      input, textarea, select {
        width: 100%;
        min-width: 0;
        padding: 13px 14px;
        color: var(--text);
        background: rgba(3, 10, 19, 0.86);
        border: 1px solid var(--line);
        border-radius: 9px;
      }

      input::placeholder, textarea::placeholder { color: #728ba1; }

      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: rgba(115, 237, 255, 0.65);
        box-shadow: 0 0 0 3px rgba(115, 237, 255, 0.06);
      }

      .hidden { display: none !important; }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1440px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 32px 16px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 66px;
        margin-bottom: 24px;
        padding: 0 4px 18px;
        border-bottom: 1px solid var(--line);
      }

      .brand { display: flex; align-items: center; gap: 13px; }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        color: var(--cyan);
        font-size: 27px;
        border: 1px solid rgba(115, 237, 255, 0.35);
        border-radius: 50%;
        box-shadow: inset 0 0 15px rgba(37, 138, 255, 0.12);
      }

      .brand-name { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; }
      .brand-sub { margin-top: 5px; color: var(--muted); font-size: 9px; letter-spacing: 0.17em; }

      .system-chip, .live-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #a8c4d8;
        font-size: 10px;
        letter-spacing: 0.13em;
      }

      .status-dot {
        display: inline-block;
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        background: #62e8c0;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(98, 232, 192, 0.55);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(245px, 0.76fr) minmax(0, 1.8fr);
        align-items: stretch;
        gap: 20px;
      }

      .panel {
        position: relative;
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--glow);
        transition: box-shadow 0.3s ease, border-color 0.3s ease;
      }

      .hud-corner {
        position: absolute;
        width: 16px;
        height: 16px;
        border-color: var(--cyan);
        border-style: solid;
        opacity: 0.7;
        pointer-events: none;
        z-index: 10;
      }
      .hud-tl { top: 0; left: 0; border-width: 2px 0 0 2px; border-top-left-radius: var(--radius); }
      .hud-tr { top: 0; right: 0; border-width: 2px 2px 0 0; border-top-right-radius: var(--radius); }
      .hud-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; border-bottom-left-radius: var(--radius); }
      .hud-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; border-bottom-right-radius: var(--radius); }

      body.is-speaking .main-panel {
        box-shadow: 0 0 50px rgba(115, 237, 255, 0.15);
        border-color: rgba(115, 237, 255, 0.4);
      }

      .panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 22px;
        right: 22px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #65dfff, transparent);
        opacity: 0.55;
        pointer-events: none;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 28px 22px 22px;
        overflow: hidden;
      }

      .reactor-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 166px;
        height: 166px;
        margin: 8px 0 23px;
        z-index: 1;
      }

      .radar {
        position: absolute;
        inset: -25px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 60%, rgba(115, 237, 255, 0.1) 90%, rgba(115, 237, 255, 0.4) 100%);
        animation: radar-sweep 3s linear infinite;
        pointer-events: none;
        z-index: 0;
      }
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .reactor {
        position: relative;
        display: grid;
        place-items: center;
        width: 116px;
        height: 116px;
        border: 1px solid rgba(115, 237, 255, 0.64);
        border-radius: 50%;
        box-shadow: 0 0 24px rgba(37, 138, 255, 0.12), inset 0 0 22px rgba(37, 138, 255, 0.1);
        transition: box-shadow 0.2s ease;
        background: var(--panel);
        z-index: 2;
      }

      .reactor::before, .reactor::after {
        content: "";
        position: absolute;
        inset: 9px;
        border: 1px solid rgba(115, 237, 255, 0.25);
        border-radius: 50%;
      }

      .reactor::after {
        inset: -10px;
        border-color: rgba(37, 138, 255, 0.3);
        border-style: dashed;
      }

      .reactor-inner {
        display: grid;
        place-items: center;
        width: 66px;
        height: 66px;
        color: #d8fbff;
        font-size: 30px;
        background: radial-gradient(circle, #286a94, #0c2741 65%, #071320);
        border: 1px solid var(--cyan);
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(115, 237, 255, 0.2), inset 0 0 18px rgba(115, 237, 255, 0.16);
        transition: box-shadow 0.2s ease;
      }

      body.is-speaking .reactor-inner {
        box-shadow: 0 0 50px rgba(115, 237, 255, 0.8), inset 0 0 30px rgba(115, 237, 255, 0.5);
        animation: reactor-speak 0.6s ease-in-out infinite alternate !important;
      }
      body.is-speaking .orbit {
        animation-duration: 4s !important;
        border-color: rgba(115, 237, 255, 0.4);
      }

      @keyframes reactor-speak {
        0% { transform: scale(1); }
        100% { transform: scale(1.08); }
      }

      .orbit {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(115, 237, 255, 0.14);
        border-radius: 50%;
        transition: border-color 0.3s ease;
        z-index: 1;
      }

      .orbit::before, .orbit::after {
        content: "";
        position: absolute;
        background: var(--cyan);
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(115, 237, 255, 0.6);
      }

      .orbit::before { width: 5px; height: 5px; top: 18px; left: 27px; }
      .orbit::after { width: 4px; height: 4px; right: 18px; bottom: 37px; }

      .system-title {
        margin: 0;
        color: var(--cyan-bright);
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.25em;
        z-index: 2;
      }

      .system-sub { margin-top: 9px; color: var(--muted); font-size: 9px; letter-spacing: 0.12em; text-align: center; z-index: 2; }

      .system-state {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 19px 0 28px;
        padding: 9px 12px;
        color: #9fead8;
        background: rgba(52, 181, 145, 0.07);
        border: 1px solid rgba(98, 232, 192, 0.16);
        border-radius: 30px;
        font-size: 9px;
        letter-spacing: 0.1em;
        z-index: 2;
      }

      .mini-heading { width: 100%; margin-bottom: 9px; color: #7593aa; font-size: 9px; letter-spacing: 0.2em; z-index: 2; }

      .metric {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 13px 0;
        border-bottom: 1px solid rgba(104, 211, 255, 0.09);
        font-size: 11px;
        z-index: 2;
      }

      .metric-label { color: var(--muted); }
      .metric-value { color: #b9e8fa; font-size: 9px; letter-spacing: 0.08em; text-align: right; }

      .sidebar-note { width: 100%; margin-top: auto; padding-top: 24px; color: var(--muted); font-size: 10px; line-height: 1.9; z-index: 2; }
      .sidebar-note span { color: #a9dced; font-size: 9px; letter-spacing: 0.13em; }

      .main-panel { display: flex; flex-direction: column; padding: 26px; }

      .main-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .heading { font-size: 14px; font-weight: 600; letter-spacing: 0.15em; }
      .heading-sub { margin-top: 7px; color: var(--muted); font-size: 11px; }

      .live-label { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; }

      #status {
        margin: 16px 0;
        padding: 10px 12px;
        color: #9bb8cc;
        background: rgba(3, 12, 23, 0.55);
        border-left: 2px solid rgba(115, 237, 255, 0.65);
        font-size: 11px;
        line-height: 1.6;
      }

      .waveform-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 60px;
        margin: 0 0 16px 0;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      .waveform-container.active { opacity: 1; }

      .waveform-container span {
        display: block;
        width: 6px;
        height: 8px;
        background: linear-gradient(to top, var(--blue), var(--cyan));
        border-radius: 4px;
        box-shadow: 0 0 12px var(--cyan);
        transition: height 0.15s ease;
      }

      .waveform-container.listening span { animation: wave-listen 1s ease-in-out infinite alternate; }
      .waveform-container.speaking span { animation: wave-speak 0.6s ease-in-out infinite alternate; }

      .waveform-container span:nth-child(1) { animation-delay: 0.0s; }
      .waveform-container span:nth-child(2) { animation-delay: 0.2s; }
      .waveform-container span:nth-child(3) { animation-delay: 0.4s; }
      .waveform-container span:nth-child(4) { animation-delay: 0.1s; }
      .waveform-container span:nth-child(5) { animation-delay: 0.3s; }
      .waveform-container span:nth-child(6) { animation-delay: 0.5s; }
      .waveform-container span:nth-child(7) { animation-delay: 0.0s; }
      .waveform-container span:nth-child(8) { animation-delay: 0.4s; }
      .waveform-container span:nth-child(9) { animation-delay: 0.2s; }
      .waveform-container span:nth-child(10) { animation-delay: 0.5s; }
      .waveform-container span:nth-child(11) { animation-delay: 0.1s; }
      .waveform-container span:nth-child(12) { animation-delay: 0.3s; }
      .waveform-container span:nth-child(13) { animation-delay: 0.0s; }
      .waveform-container span:nth-child(14) { animation-delay: 0.4s; }
      .waveform-container span:nth-child(15) { animation-delay: 0.2s; }
      .waveform-container span:nth-child(16) { animation-delay: 0.3s; }

      @keyframes wave-listen {
        0% { height: 8px; opacity: 0.6; }
        100% { height: 28px; opacity: 1; }
      }
      @keyframes wave-speak {
        0% { height: 10px; opacity: 0.7; }
        100% { height: 55px; opacity: 1; }
      }

      .typing-indicator {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 12px 16px;
        background: rgba(3, 10, 19, 0.8);
        border: 1px solid rgba(104, 211, 255, 0.18);
        border-radius: 0;
        border-left: 2px solid var(--cyan);
        align-self: flex-start;
        width: fit-content;
      }
      .typing-indicator span {
        width: 6px;
        height: 6px;
        background-color: var(--cyan);
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out both;
      }
      .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
      .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
      @keyframes typing {
        0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
        40% { transform: scale(1); opacity: 1; box-shadow: 0 0 10px var(--cyan); }
      }

      #login { width: min(100%, 440px); margin: auto; padding: 34px 0 38px; }
      .login-symbol { color: var(--cyan); font-size: 9px; letter-spacing: 0.14em; line-height: 1.8; }
      .login-title { margin: 18px 0 10px; font-size: clamp(25px, 3vw, 34px); font-weight: 500; letter-spacing: 0.04em; }
      .login-copy { margin: 0 0 25px; color: var(--muted); font-size: 13px; line-height: 1.8; }
      #loginForm { display: grid; gap: 12px; }

      .primary {
        width: 100%;
        min-height: 47px;
        color: #04111c;
        background: linear-gradient(100deg, #66dfff, #9cefff);
        border: 1px solid #a5f3ff;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.13em;
      }

      .primary:hover:not(:disabled) { background: #c0f6ff; box-shadow: 0 0 20px rgba(115, 237, 255, 0.12); }

      .lockout-notice { color: #ffb9b9; font-size: 12px; line-height: 1.7; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 17px; }
      .toolbar button, .setting-buttons button { font-size: 10px; }

      .settings { margin-bottom: 22px; padding: 19px; background: rgba(3, 11, 21, 0.75); border: 1px solid var(--line); border-radius: 12px; }
      .settings h2 { margin: 0 0 19px; color: var(--cyan); font-size: 10px; letter-spacing: 0.14em; }
      .setting { margin-bottom: 19px; }
      .setting label { display: block; margin-bottom: 9px; color: #d5e7f2; font-size: 12px; }
      .setting small { display: block; margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.7; }
      .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .toggle-row label { margin: 0; }
      input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--cyan); }
      input[type="range"] { padding: 0; accent-color: var(--cyan); }
      .setting-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
      #settingsNotice { margin-top: 10px; color: var(--cyan); font-size: 11px; }

      .chat-label { display: flex; justify-content: space-between; gap: 12px; margin: 6px 0 12px; color: #9ab6c9; font-size: 9px; letter-spacing: 0.12em; }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 13px;
        min-height: 280px;
        max-height: 46vh;
        overflow-y: auto;
        padding: 17px;
        background-color: rgba(3, 10, 19, 0.62);
        background-image: linear-gradient(rgba(3, 10, 19, 0.85), rgba(3, 10, 19, 0.85)), 
                          repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(115, 237, 255, 0.02) 2px, rgba(115, 237, 255, 0.02) 4px);
        border: 1px solid var(--line);
        border-radius: 12px;
        scrollbar-color: #235e82 transparent;
        scrollbar-width: thin;
      }

      #messages:empty::before {
        content: "CANAL DISPONÍVEL — AGUARDANDO COMUNICAÇÃO";
        display: block;
        margin: auto;
        color: #526f84;
        font-size: 10px;
        letter-spacing: 0.1em;
        line-height: 1.9;
        text-align: center;
      }

      #messages::-webkit-scrollbar { width: 5px; }
      #messages::-webkit-scrollbar-thumb { background: #235e82; border-radius: 8px; }

      .msg {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 90%;
        padding: 10px 14px;
        border: 1px solid rgba(115, 237, 255, 0.05);
        border-left: 2px solid var(--cyan);
        border-radius: 0;
        background: linear-gradient(90deg, rgba(115, 237, 255, 0.03) 0%, transparent 100%);
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        line-height: 1.7;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .msg strong {
        color: var(--cyan);
        font-size: 10px;
        letter-spacing: 0.14em;
      }

      .msg strong::before { content: "["; }
      .msg strong::after { content: "]"; }

      .bot span::before { content: "> "; color: var(--cyan); font-weight: bold; }

      .user {
        align-self: flex-end;
        border-left: none;
        border-right: 2px solid var(--blue);
        background: linear-gradient(270deg, rgba(37, 138, 255, 0.03) 0%, transparent 100%);
        text-align: left;
      }

      .user strong { color: var(--blue); }
      .user span::before { content: "< "; color: var(--blue); font-weight: bold; }

      .composer { margin-top: 18px; padding: 17px; background: rgba(8, 20, 33, 0.68); border: 1px solid var(--line); border-radius: 12px; }
      .composer-title { margin-bottom: 12px; color: #94b4c9; font-size: 9px; letter-spacing: 0.16em; }
      #chatForm { display: grid; gap: 11px; }
