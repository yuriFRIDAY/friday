name: FRIDAY tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py core tests
      - name: Run test suite
        env:
          GROQ_API_KEY: test-key-for-ci
          FRIDAY_PASSWORD: test-password
          DATA_DIR: /tmp/friday-ci
          ENV: test
        run: pytest -q
